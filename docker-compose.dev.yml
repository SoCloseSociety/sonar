# ╔═══════════════════════════════════════════════════════════╗
# ║  SONAR — Development (Mac / local testing)              ║
# ║  Usage: docker compose -f docker-compose.dev.yml up -d  ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Optimized for Mac:
#  • Low memory limits (total ~1.2 GB for all containers)
#  • Slower scan intervals (less CPU / network / Ollama load)
#  • Hot-reload on backend & frontend code changes
#  • No nginx proxy (direct port access)
#  • PostgreSQL tuned for low memory
#  • Fewer concurrent DB connections

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonar}
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar_secret}
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=30
        -c effective_cache_size=128MB
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.7
        -c log_min_messages=warning
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 64M
    command: >
      redis-server
        --maxmemory 32mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      APP_ENV: development
      # Slower scan intervals to reduce CPU/network/Ollama load on Mac
      SCAN_INTERVAL_SECONDS: 300
      FLIGHT_SCAN_INTERVAL: 120
      VESSEL_SCAN_INTERVAL: 300
      TENSION_UPDATE_INTERVAL: 600
      # Disable heavy or low-priority sources on Mac
      ENABLE_SHODAN: "false"
      ENABLE_ACLED: "false"
      ENABLE_REDDIT: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
      VITE_API_PROXY: "http://backend:8000"
      NODE_OPTIONS: "--max-old-space-size=512"
    command: npm run dev -- --host 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    name: sonar-dev
